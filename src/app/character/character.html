<div class="screen">
  <div class="header">
    <h1>Nível {{ characterService.character().level }}</h1>
    <p class="xp">{{ characterService.character().xp }} XP</p>
  </div>

  <div class="attrs">
    <div class="attr">
      <span>Força</span>
      <div class="bar-bg">
        <div class="bar-fill" [style.width.%]="characterService.character().strength"></div>
      </div>
    </div>
    <div class="attr">
      <span>Resistência</span>
      <div class="bar-bg">
        <div class="bar-fill" [style.width.%]="characterService.character().endurance"></div>
      </div>
    </div>
    <div class="attr">
      <span>Disciplina</span>
      <div class="bar-bg">
        <div class="bar-fill" [style.width.%]="characterService.character().discipline"></div>
      </div>
    </div>
    <div class="attr">
      <span>Nutrição</span>
      <div class="bar-bg">
        <div class="bar-fill" [style.width.%]="characterService.character().nutrition"></div>
      </div>
    </div>
    <div class="attr">
      <span>Recuperação</span>
      <div class="bar-bg">
        <div class="bar-fill" [style.width.%]="characterService.character().recovery"></div>
      </div>
    </div>
  </div>

  <p class="streak">🔥 Streak: {{ characterService.character().streakDays }} dias</p>

  <div class="nav-buttons">
    <a routerLink="/treino" class="btn-nav btn-primary"> 💪 Registrar treino </a>
    <a routerLink="/medidas" class="btn-nav btn-secondary"> 📏 Registrar medidas </a>
    <a routerLink="/perfil" class="btn-nav btn-secondary"> 👤 Minha ficha </a>
  </div>
</div>
