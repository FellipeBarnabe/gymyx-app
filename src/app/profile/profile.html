<div class="screen">
  <h1>Sua Ficha</h1>
  <p class="subtitle">Quanto mais completa, mais preciso será o seu personagem.</p>

  <div class="field">
    <label>Nome</label>
    <input type="text" [(ngModel)]="form.nome" placeholder="Seu nome" />
  </div>

  <div class="field">
    <label>Idade</label>
    <input type="number" [(ngModel)]="form.idade" placeholder="Ex: 36" />
  </div>

  <div class="field">
    <label>Peso atual (kg)</label>
    <input type="number" [(ngModel)]="form.peso" placeholder="Ex: 62.7" />
  </div>

  <div class="field">
    <label>Altura (cm)</label>
    <input type="number" [(ngModel)]="form.altura" placeholder="Ex: 172" />
  </div>

  <div class="field">
    <label>Objetivo</label>
    <select [(ngModel)]="form.objetivo">
      <option value="hipertrofia">Hipertrofia</option>
      <option value="emagrecimento">Emagrecimento</option>
      <option value="condicionamento">Condicionamento</option>
    </select>
  </div>

  <div class="field">
    <label>Nível de experiência</label>
    <select [(ngModel)]="form.experiencia">
      <option value="iniciante">Iniciante</option>
      <option value="intermediario">Intermediário</option>
      <option value="avancado">Avançado</option>
    </select>
  </div>

  <div class="field">
    <label>Frequência semanal (dias por semana)</label>
    <input type="number" [(ngModel)]="form.frequenciaSemanal" min="1" max="7" />
  </div>

  <button class="btn-salvar" (click)="salvar()">Salvar e continuar</button>
  <button class="btn-pular" (click)="pular()">Pular por agora</button>
</div>
